<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#a3161a">
<title>Reg-4 Study</title>
<style>
:root{
  --bg:#f4f1ec; --card:#ffffff; --ink:#1c1a18; --muted:#5e5850; --line:#d9d3c9;
  --brand:#a3161a; --brand-ink:#ffffff; --good:#1b7a3d; --good-bg:#e2f3e7;
  --bad:#b3261e; --bad-bg:#fbe6e4; --soft:#ece7df;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151312; --card:#221f1d; --ink:#f3efe9; --muted:#b3aba0; --line:#3b3632;
    --brand:#d8423f; --brand-ink:#ffffff; --good:#6fd08f; --good-bg:#17341f;
    --bad:#ff8a80; --bad-bg:#42191a; --soft:#2c2825;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:20px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
#app{max-width:640px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom));}
h1{font-size:28px;line-height:1.2;margin:8px 0 4px}
h2{font-size:23px;line-height:1.25;margin:0 0 12px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:17px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top h2{margin:0;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{display:block;width:100%;min-height:64px;padding:14px 18px;margin-bottom:12px;
  border-radius:14px;border:2px solid var(--line);background:var(--card);
  font-weight:650;text-align:left;overflow-wrap:anywhere}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);text-align:center}
.btn.center{text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.btn[data-act=pick]:disabled{opacity:1}
.btn .sub{display:block;font-weight:400;font-size:17px;color:var(--muted);margin-top:2px}
.btn.primary .sub{color:inherit;opacity:.9}
.btn.right{border-color:var(--good);background:var(--good-bg)}
.btn.wrong{border-color:var(--bad);background:var(--bad-bg)}
.back{min-height:52px;min-width:52px;padding:0 14px;border-radius:12px;border:2px solid var(--line);
  background:var(--card);font-weight:650}
.row{display:flex;gap:12px}
.row .btn{flex:1}
.chips{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.chip{min-height:56px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);
  background:var(--card);text-align:left;font-weight:600;display:flex;align-items:center;gap:12px}
.chip .box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);
  display:grid;place-items:center;font-size:20px;line-height:1}
.chip.on{border-color:var(--brand)}
.chip.on .box{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip .n{margin-left:auto;color:var(--muted);font-weight:400;font-size:17px}
.tag{display:inline-block;font-size:15px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px}
.src{font-size:17px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.src b{color:var(--ink)}
.flash{min-height:260px;display:flex;flex-direction:column;width:100%;text-align:left}
.flash .body{flex:1;font-size:23px;line-height:1.35;overflow-wrap:anywhere}
.flash .hint{color:var(--muted);font-size:17px;margin-top:14px}
.qtext{font-size:23px;line-height:1.35;font-weight:600;margin-bottom:16px;overflow-wrap:anywhere}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--brand)}
.score{font-size:64px;font-weight:800;line-height:1;margin:8px 0}
.verdict{font-size:30px;font-weight:800;margin-bottom:8px}
.pass{color:var(--good)} .fail{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:28px;line-height:1.1}
.stat span{font-size:15px;color:var(--muted)}
.step{border-left:4px solid var(--brand);padding:4px 0 4px 14px;margin-bottom:14px;overflow-wrap:anywhere}
.step .k{font-size:15px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.03em}
.answer{background:var(--good-bg);border:2px solid var(--good);border-radius:14px;padding:14px;font-weight:700;margin-bottom:12px}
input.code{width:100%;min-height:68px;font:700 30px/1 ui-monospace,Menlo,Consolas,monospace;
  letter-spacing:.2em;text-align:center;text-transform:uppercase;border-radius:14px;
  border:2px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:12px;padding:8px}
.err{color:var(--bad);font-weight:650;min-height:1.5em}
ul.missed{list-style:none;padding:0;margin:0 0 16px}
ul.missed li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;overflow-wrap:anywhere}
ul.missed .a{color:var(--good);font-weight:650;margin-top:6px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
</style>
</head>

let QUESTIONS = [], PROBLEMS = [], byId = {};

const CATS = [
  { id:"pss", name:"Pressurized Stair Shaft" },
  { id:"sps", name:"Standpipe and Sprinkler" },
  { id:"ssa", name:"Supervising Station Alarm" },
  { id:"gen", name:"General Reg-4" }
];
const CAT_NAME = Object.fromEntries(CATS.map(c => [c.id, c.name]));
const PASS_PCT = 80;
const KEYSTORE = "reg4study.key";
const KEY = "reg4study.v1";

/* ---------- saved progress (this device only) ---------- */
let S = { cats:["pss","sps","ssa","gen"], missed:{}, stats:{}, quizzes:[] };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- helpers ---------- */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const inCats = list => list.filter(x => S.cats.includes(x.cat));
const hasChoices = q => Array.isArray(q.wrong) && q.wrong.length > 0;
const missedList = () => Object.keys(S.missed).filter(id => byId[id]).map(id => byId[id]);
function record(q, ok){
  const st = S.stats[q.id] || (S.stats[q.id] = { seen:0, right:0, last:false });
  st.seen++; if (ok) st.right++; st.last = ok;
  if (ok) delete S.missed[q.id]; else S.missed[q.id] = 1;
  save();
}
const srcHtml = q => `<div class="src">Source: <b>${esc(q.source)}</b></div>`;
const topBar = title => `<div class="top"><button class="back" data-act="home" aria-label="Back to home">&larr; Home</button><h2>${esc(title)}</h2></div>`;
const bar = (i, n) => `<div class="bar"><i style="width:${n ? Math.round(i / n * 100) : 0}%"></i></div>`;

let V = { name:"home" };          // current view state
function go(v){ V = v; render(); window.scrollTo(0, 0); }

/* ---------- views ---------- */
const views = {
  gate(){
    return `<h1>Reg-4 Study</h1>
      <p class="muted">Enter your 8-character access code. You only need to do this once on this device.</p>
      <form data-form="gate" autocomplete="off">
        <input class="code" id="code" maxlength="8" inputmode="text" autocapitalize="characters"
               autocorrect="off" spellcheck="false" aria-label="Access code" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
        <div class="err" id="err" role="alert"></div>
        <button class="btn primary" type="submit">Unlock</button>
      </form>`;
  },

  home(){
    const qs = inCats(QUESTIONS), mc = qs.filter(hasChoices), ps = inCats(PROBLEMS);
    const missed = missedList().length;
    const mastered = qs.filter(q => S.stats[q.id] && S.stats[q.id].last).length;
    const last = S.quizzes[S.quizzes.length - 1];
    const count = id => QUESTIONS.filter(q => q.cat === id).length;
    return `<h1>Reg-4 Study</h1>
      <p class="muted">LAFD Regulation 4 exam practice</p>
      ${QUESTIONS.length + PROBLEMS.length === 0 ? `<div class="card"><b>No study questions loaded yet.</b>
        <p class="muted small" style="margin:8px 0 0">Questions are added only from the LAFD Reg-4 manual, the study reference table and the company study packs.</p></div>` : ""}
      <div class="tag">Study these categories</div>
      <div class="chips">${CATS.map(c => `<button class="chip ${S.cats.includes(c.id) ? "on" : ""}" data-act="cat" data-id="${c.id}" aria-pressed="${S.cats.includes(c.id)}">
        <span class="box">${S.cats.includes(c.id) ? "&#10003;" : ""}</span>${esc(c.name)}<span class="n">${count(c.id)}</span></button>`).join("")}</div>
      <div class="stats">
        <div class="stat"><b>${mastered}/${qs.length}</b><span>Got right</span></div>
        <div class="stat"><b>${missed}</b><span>Missed</span></div>
        <div class="stat"><b>${last ? last.pct + "%" : "&ndash;"}</b><span>Last quiz</span></div>
      </div>
      <button class="btn" data-act="flash" ${qs.length ? "" : "disabled"}>Flashcards<span class="sub">${qs.length} cards</span></button>
      <button class="btn" data-act="quizsetup" ${mc.length ? "" : "disabled"}>Multiple-Choice Quiz<span class="sub">${mc.length} questions available &middot; ${PASS_PCT}% to pass</span></button>
      <button class="btn" data-act="problems" ${ps.length ? "" : "disabled"}>Practice Problems<span class="sub">${ps.length} step-by-step problems</span></button>
      <button class="btn" data-act="review" ${missed ? "" : "disabled"}>Review Missed Questions<span class="sub">${missed} to retry</span></button>
      <button class="btn center small" data-act="reset" style="min-height:52px;margin-top:12px">Reset my progress</button>`;
  },

  flash(){
    const d = V.deck, q = d[V.i];
    if (!q) return topBar("Flashcards") + `<div class="card"><h2>Deck finished</h2>
      <p>You went through ${d.length} cards. Got it: ${V.ok}. Missed: ${d.length - V.ok}.</p></div>
      <button class="btn primary" data-act="flash">Go again</button>
      <button class="btn center" data-act="home">Home</button>`;
    return topBar("Flashcards") + bar(V.i, d.length) +
      `<p class="muted small">Card ${V.i + 1} of ${d.length}</p>
      <button class="card flash" data-act="flip" aria-live="polite">
        <span class="tag">${esc(CAT_NAME[q.cat])} &middot; ${V.flipped ? "Answer" : "Question"}</span>
        <span class="body">${esc(V.flipped ? q.a : q.q)}</span>
        ${V.flipped ? srcHtml(q) : `<span class="hint">Tap to see the answer</span>`}
      </button>
      ${V.flipped ? `<div class="row"><button class="btn center wrong" data-act="grade" data-ok="0">Missed it</button>
        <button class="btn center right" data-act="grade" data-ok="1">Got it</button></div>`
        : `<button class="btn primary" data-act="flip">Show answer</button>`}`;
  },

  quizsetup(){
    const n = inCats(QUESTIONS).filter(hasChoices).length;
    const opt = k => `<button class="btn primary" data-act="quiz" data-n="${k}">${Math.min(k, n)} questions${n < k ? `<span class="sub">Only ${n} available in the selected categories</span>` : ""}</button>`;
    return topBar("Quiz") + `<div class="card"><p>Random questions from your selected categories.</p>
      <p class="muted small" style="margin:0">The real exam needs ${PASS_PCT}% to pass. You will see pass or fail at the end.</p></div>` +
      opt(10) + (n > 10 ? opt(20) : "");
  },

  quiz(){
    const q = V.items[V.i], title = V.review ? "Review Missed" : "Quiz";
    let body;
    if (hasChoices(q)) {
      body = V.choices.map((c, k) => {
        let cls = "";
        if (V.picked != null) cls = c === q.a ? "right" : (k === V.picked ? "wrong" : "");
        return `<button class="btn ${cls}" data-act="pick" data-k="${k}" ${V.picked != null ? "disabled" : ""}>${esc(c)}</button>`;
      }).join("");
      if (V.picked != null) body += `<div class="card" role="status"><b class="${V.lastOk ? "pass" : "fail"}">${V.lastOk ? "Correct" : "Not correct"}</b>
        <p style="margin:6px 0 0">Answer: ${esc(q.a)}</p>${srcHtml(q)}</div>`;
    } else {                                   // flashcard-only item in review
      body = V.picked == null ? `<button class="btn primary" data-act="reveal">Show answer</button>`
        : `<div class="card"><p style="margin:0">Answer: ${esc(q.a)}</p>${srcHtml(q)}</div>` +
          (V.graded ? "" : `<div class="row"><button class="btn center wrong" data-act="self" data-ok="0">Missed it</button>
            <button class="btn center right" data-act="self" data-ok="1">Got it</button></div>`);
    }
    const done = V.picked != null && (hasChoices(q) || V.graded);
    return topBar(title) + bar(V.i, V.items.length) +
      `<p class="muted small">Question ${V.i + 1} of ${V.items.length} &middot; ${esc(CAT_NAME[q.cat])}</p>
      <div class="qtext">${esc(q.q)}</div>${body}
      ${done ? `<button class="btn primary" data-act="next">${V.i + 1 < V.items.length ? "Next question" : "See my score"}</button>` : ""}`;
  },

  result(){
    const pct = Math.round(V.right / V.total * 100), pass = pct >= PASS_PCT;
    return topBar(V.review ? "Review Result" : "Quiz Result") +
      `<div class="card" style="text-align:center">
        <div class="score">${pct}%</div>
        ${V.review ? "" : `<div class="verdict ${pass ? "pass" : "fail"}">${pass ? "PASS" : "FAIL"}</div>`}
        <p>${V.right} of ${V.total} correct${V.review ? "" : ` &middot; ${PASS_PCT}% needed to pass`}</p></div>
      ${V.wrong.length ? `<div class="tag">Questions you missed</div><ul class="missed">${V.wrong.map(q =>
        `<li>${esc(q.q)}<div class="a">${esc(q.a)}</div>${srcHtml(q)}</li>`).join("")}</ul>
        <button class="btn primary" data-act="review">Retry missed questions</button>` : `<p>Nothing missed. Good work.</p>`}
      <button class="btn center" data-act="home">Home</button>`;
  },

  problems(){
    const ps = inCats(PROBLEMS), p = ps[V.i];
    const shown = V.shown, all = shown > p.steps.length;
    return topBar("Practice Problems") +
      `<p class="muted small">Problem ${V.i + 1} of ${ps.length} &middot; ${esc(CAT_NAME[p.cat])}</p>
      <div class="card"><h2>${esc(p.title)}</h2><p style="margin:0">${esc(p.prompt)}</p></div>
      ${p.steps.slice(0, shown).map((s, k) => `<div class="step"><div class="k">Step ${k + 1}</div>${esc(s)}</div>`).join("")}
      ${all ? `<div class="answer">Answer: ${esc(p.answer)}</div>${srcHtml(p)}<div style="height:16px"></div>` :
        `<button class="btn primary" data-act="step">${shown === 0 ? "Show first step" : shown < p.steps.length ? "Next step" : "Show answer"}</button>`}
      <div class="row"><button class="btn center" data-act="pprev" ${V.i ? "" : "disabled"}>Previous</button>
        <button class="btn center" data-act="pnext" ${V.i + 1 < ps.length ? "" : "disabled"}>Next problem</button></div>`;
  }
};

function render(){ app.innerHTML = views[V.name](); }

/* ---------- actions ---------- */
function startQuiz(items, review){
  go({ name:"quiz", items, review, i:0, right:0, wrong:[], picked:null, choices:mix(items[0]) });
}
function mix(q){ return hasChoices(q) ? shuffle([q.a, ...q.wrong]) : []; }
function answered(ok){
  const q = V.items[V.i];
  V.lastOk = ok; if (ok) V.right++; else V.wrong.push(q);
  record(q, ok);
}

const acts = {
  home(){ go({ name:"home" }); },
  cat(el){
    const id = el.dataset.id, on = S.cats.includes(id);
    if (on && S.cats.length === 1) return;            // keep at least one
    S.cats = on ? S.cats.filter(c => c !== id) : [...S.cats, id];
    save(); render();
  },
  flash(){ go({ name:"flash", deck:shuffle(inCats(QUESTIONS)), i:0, ok:0, flipped:false }); },
  flip(){ V.flipped = !V.flipped; render(); },
  grade(el){
    const ok = el.dataset.ok === "1";
    record(V.deck[V.i], ok); if (ok) V.ok++;
    V.i++; V.flipped = false; render(); window.scrollTo(0, 0);
  },
  quizsetup(){ go({ name:"quizsetup" }); },
  quiz(el){
    const pool = shuffle(inCats(QUESTIONS).filter(hasChoices));
    startQuiz(pool.slice(0, +el.dataset.n), false);
  },
  review(){ const m = shuffle(missedList()); if (m.length) startQuiz(m, true); else acts.home(); },
  pick(el){
    if (V.picked != null) return;
    V.picked = +el.dataset.k;
    answered(V.choices[V.picked] === V.items[V.i].a);
    render();
  },
  reveal(){ V.picked = -1; V.graded = false; render(); },
  self(el){ V.graded = true; answered(el.dataset.ok === "1"); acts.next(); },
  next(){
    if (V.i + 1 < V.items.length) {
      V.i++; V.picked = null; V.graded = false; V.choices = mix(V.items[V.i]); render(); window.scrollTo(0, 0);
    } else {
      const total = V.items.length;
      if (!V.review) { S.quizzes.push({ t:Date.now(), n:total, pct:Math.round(V.right / total * 100) }); S.quizzes = S.quizzes.slice(-20); save(); }
      go({ name:"result", right:V.right, total, wrong:V.wrong, review:V.review });
    }
  },
  problems(){ go({ name:"problems", i:0, shown:0 }); },
  step(){ V.shown++; render(); },
  pprev(){ go({ name:"problems", i:V.i - 1, shown:0 }); },
  pnext(){ go({ name:"problems", i:V.i + 1, shown:0 }); },
  reset(){
    if (!confirm("Erase all saved progress on this device? This cannot be undone.")) return;
    S.missed = {}; S.stats = {}; S.quizzes = []; save(); render();
  }
};

app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled && acts[el.dataset.act]) acts[el.dataset.act](el);
});

/* ---------- access code: unlocks (decrypts) the study content ---------- */
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyBits(code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode("reg4:" + code), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits(
    { name:"PBKDF2", hash:"SHA-256", salt:b64d(VAULT.salt), iterations:VAULT.iter }, base, 256));
}
async function openVault(bits){
  const key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64d(VAULT.iv) }, key, b64d(VAULT.data));
  const c = JSON.parse(new TextDecoder().decode(buf));
  QUESTIONS = c.QUESTIONS; PROBLEMS = c.PROBLEMS;
  byId = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
}

app.addEventListener("submit", async e => {
  e.preventDefault();
  const code = document.getElementById("code").value.trim().toUpperCase();
  const err = document.getElementById("err"), btn = app.querySelector("button[type=submit]");
  if (code.length !== 8) { err.textContent = "The code is 8 characters."; return; }
  if (!window.crypto || !crypto.subtle) { err.textContent = "This browser cannot check the code. Open the site over https."; return; }
  btn.disabled = true; btn.textContent = "Checking..."; err.textContent = "";
  try {
    const bits = await keyBits(code);
    await openVault(bits);
    try { localStorage.setItem(KEYSTORE, btoa(String.fromCharCode(...bits))); } catch (x) {}
    go({ name:"home" });
  } catch (x) {
    btn.disabled = false; btn.textContent = "Unlock";
    err.textContent = "That code is not correct. Try again.";
  }
});

/* start: a device that already entered the code opens straight to the app */
(async () => {
  let ok = false;
  try { const k = localStorage.getItem(KEYSTORE); if (k) { await openVault(b64d(k)); ok = true; } } catch (x) {}
  go({ name: ok ? "home" : "gate" });
})();
</script>
